<div class="C_main">
    <div v-if="loading" class="C_loading">
        <forge-loader variant="dots" label="Loading quote..." />
    </div>

    <div v-else-if="error" class="C_error">
        <p>{{ error }}</p>
        <forge-button label="Back to Quotes" @click="goBack" />
    </div>

    <template v-else-if="quote">
        <!-- Breadcrumb trail -->
        <quote-breadcrumb :quote="quote" :quote_id="quoteId" :active_tab="activeTab" :tabs="tabs" />

        <!-- Header -->
        <div class="C_header_row">
            <div>
                <span class="C_back" @click="goBack">← Back to Quotes</span>
                <h1 class="C_title">{{ quote.name }}</h1>
                <div class="C_meta">
                    <span class="status-pill" :class="status">{{ status }}</span>
                    <span class="C_meta_item">Customer: {{ (quote.data && quote.data.customerName) || '—' }}</span>
                    <span class="C_meta_item">Currency: {{ currency }}</span>
                    <span class="C_meta_item">Margin:
                        <button class="C_link" @click="openMarginEditor">{{ marginPercent != null ? marginPercent + '%' : '30%' }}</button>
                    </span>
                </div>
            </div>
            <div class="C_actions">
                <forge-button label="Export PDF" @click="exportPdf" />
            </div>
        </div>

        <!-- Status history -->
        <div v-if="statusHistory.length" class="C_history">
            <span v-for="(h, i) in statusHistory.slice().reverse().slice(0, 5)" :key="i" class="C_history_chip">
                <span class="status-pill" :class="h.status">{{ h.status }}</span>
                <span class="C_history_date">{{ h.date }}</span>
            </span>
        </div>

        <!-- Tabs -->
        <forge-tabs :tabs="tabs" :value="activeTab" @input="onTabSelect" />

        <!-- The shell loaded the quote + material library ONCE and hands
             the shared state down as props; each tab keeps its own domain fetch
             (tree / takeoff / compat) and owns its own actions.

             Tabs use v-show (not v-if) so switching preserves each tab's in-memory
             state (scroll, edit inputs, expanded tree, RFQ review grid) instead of
             destroying + refetching on every switch. Lazy-load still mounts each
             tab component on first visit; v-show only hides it afterward. -->
        <quote-entities v-show="activeTab === 'entities'"
            :quote-id="quoteId" :quote="quote" :entities="entities" :token="refreshToken"
            @changed="load" @dirty="markDirty" />
        <quote-materials v-show="activeTab === 'materials'"
            :quote-id="quoteId" :quote="quote" :entities="entities"
            @changed="load" @dirty="markDirty" />
        <quote-process v-show="activeTab === 'process'"
            :entities="entities" :costs="costs" :quote="quote"
            @changed="load" @dirty="markDirty" />
        <quote-cost v-show="activeTab === 'cost'"
            :quote-id="quoteId" :quote="quote" :entities="entities"
            :costs="costs" :totals="totals" :margin-percent="marginPercent"
            @changed="load" />
        <quote-docs v-show="activeTab === 'docs'"
            :quote-id="quoteId" @changed="load" @dirty="markDirty" />
    </template>

    <div v-else class="C_error">
        <p>Quote not found.</p>
        <forge-button label="Back to Quotes" @click="goBack" />
    </div>
</div>
