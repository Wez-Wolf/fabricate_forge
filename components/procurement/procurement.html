<div class="C_main">
    <div class="C_header_row">
        <div>
            <h1 class="C_title">Procurement</h1>
            <p class="C_subtitle">Purchase orders, supplier quotes, and received goods.</p>
        </div>
    </div>

    <div v-if="error" class="C_error">{{ error }}</div>

    <forge-tabs :tabs="tabs" :value="activeTab" @input="onTab" />

    <!-- Purchase Orders -->
    <div v-if="activeTab === 'pos'" class="C_tab_content">
        <div class="C_tab_toolbar">
            <div class="C_filters">
                <span
                    v-for="s in poStatuses"
                    :key="s"
                    class="C_filter_chip"
                    :class="{ 'C_active': poFilter === s }"
                    @click="setPoFilter(s)"
                >{{ s }}</span>
            </div>
            <forge-button label="+ New Purchase Order" @click="openPo" />
        </div>

        <div v-if="loadingPos" class="C_loading">
            <forge-loader variant="dots" label="Loading purchase orders..." />
        </div>

        <div class="C_list">
            <forge-list
                v-if="!loadingPos"
                :fields="poFields"
                :value="poRows"
                @onSvg="onPoSvg"
            />
            <div v-if="!loadingPos && !poRows.length" class="C_empty">
                <p>No purchase orders yet.</p>
                <forge-button label="Create a purchase order" @click="openPo" />
            </div>
        </div>
    </div>

    <!-- Supplier Quotes -->
    <div v-if="activeTab === 'sqs'" class="C_tab_content">
        <div class="C_tab_toolbar">
            <forge-button label="+ New Supplier Quote" @click="openSq" />
        </div>

        <div v-if="loadingSqs" class="C_loading">
            <forge-loader variant="dots" label="Loading supplier quotes..." />
        </div>

        <div class="C_list">
            <forge-list
                v-if="!loadingSqs"
                :fields="sqFields"
                :value="sqRows"
            />
            <div v-if="!loadingSqs && !sqRows.length" class="C_empty">
                <p>No supplier quotes yet.</p>
                <forge-button label="Add a supplier quote" @click="openSq" />
            </div>
        </div>
    </div>

    <!-- Received Goods -->
    <div v-if="activeTab === 'rgs'" class="C_tab_content">
        <div class="C_tab_toolbar">
            <forge-button label="+ Log Received Goods" @click="openRg" />
        </div>

        <div v-if="loadingRgs" class="C_loading">
            <forge-loader variant="dots" label="Loading received goods..." />
        </div>

        <div class="C_list">
            <forge-list
                v-if="!loadingRgs"
                :fields="rgFields"
                :value="rgRows"
            />
            <div v-if="!loadingRgs && !rgRows.length" class="C_empty">
                <p>Nothing received yet.</p>
                <forge-button label="Log received goods" @click="openRg" />
            </div>
        </div>
    </div>
</div>
