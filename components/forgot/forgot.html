<div class="C_canvas">
    <div class="C_card">
        <h1 class="C_title">Reset Password</h1>
        <p class="C_sub">Enter your email and we'll send you a reset link.</p>

        <div v-if="error" class="C_error">{{ error }}</div>
        <div v-if="success" class="C_success">
            <p>{{ success }}</p>
            <p v-if="token" class="C_token_hint">
                Dev mode — your reset link:<br />
                <a :href="resetUrl" class="C_link">{{ resetUrl }}</a>
            </p>
            <forge-button label="Back to Login" @click="goLogin" />
        </div>

        <div v-else class="C_form" @keyup.enter="send">
            <forge-input label="Email" type="email" v-model="email" placeholder="your@email.com" required />
            <forge-button label="Send Reset Link" @click="send" :disabled="loading" />
            <p class="C_link" @click="goLogin">← Back to Login</p>
        </div>
    </div>
</div>
