<div class="C_main">
    <div class="C_field">
        <label class="C_label">Item Name <span class="C_req">*</span></label>
        <input v-model="form.name" type="text" class="C_input" placeholder="e.g. Pipe spool 6 m DN100" />
    </div>

    <div class="C_field_row">
        <div class="C_field">
            <label class="C_label">Type</label>
            <select v-model="form.type" class="C_input">
                <option v-for="t in typeOptions" :key="t.v" :value="t.v">{{ t.label }}</option>
            </select>
        </div>
        <div class="C_field">
            <label class="C_label">Quantity</label>
            <input v-model.number="form.quantity" type="number" min="1" class="C_input" />
        </div>
    </div>

    <p v-if="isAssembly" class="C_hint">Assembly — costs roll up from its child items. Materials, paint and process hours belong on the parts beneath it.</p>

    <!-- ── Material section: parts/fasteners + material-only items (never assemblies) ── -->
    <template v-if="showMaterial">
        <div class="C_section_label">Material</div>
        <div class="C_field">
            <label class="C_label">Material</label>
            <material-select v-model="form.material_id" @input="onMaterialPick" />
        </div>

        <div class="C_field_row">
            <div class="C_field">
                <label class="C_label">Length (mm)</label>
                <input v-model="form.length" type="number" step="0.1" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Width (mm)</label>
                <input v-model="form.width" type="number" step="0.1" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Thickness (mm)</label>
                <input v-model="form.thickness" type="number" step="0.1" class="C_input" />
            </div>
        </div>

        <!-- Derived mass: the part's mass comes from its material + dims -->
        <p class="C_hint">Mass: <strong>{{ massPreview }}</strong> <template v-if="massPreview !== '—'">(derived from material × dimensions)</template></p>

        <!-- ── Material variables (kind-aware: pipe / flange / fitting) ── -->
        <div v-if="kind === 'pipe'" class="C_section_label">Pipe Variables</div>
        <div v-if="kind === 'pipe'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Butt Weld Qty</label>
                <input v-model.number="form.buttWeldQty" type="number" min="0" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Cost R/m</label>
                <input v-model.number="form.costPerM" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Shop Handling (BM hrs/kg)</label>
                <input v-model.number="form.shopHrsPerKg" type="number" step="0.001" min="0" class="C_input" />
            </div>
        </div>

        <div v-if="kind === 'flange'" class="C_section_label">Flange Variables</div>
        <div v-if="kind === 'flange'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Weld Type</label>
                <select v-model="form.weldType" class="C_input">
                    <option value="">Auto (library)</option>
                    <option value="WN">WN — weld neck (butt weld)</option>
                    <option value="SO">SO — slip-on (2 fillet welds)</option>
                    <option value="SW">SW — socket weld (1 fillet)</option>
                    <option value="BLIND">BLIND — bolted (no weld)</option>
                    <option value="LOOSE">LOOSE — bolted loose (no weld)</option>
                </select>
            </div>
            <div class="C_field">
                <label class="C_label">Pipe WT fitted to (mm)</label>
                <input v-model.number="form.pipeWt" type="number" step="0.01" min="0" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Cost R/ea</label>
                <input v-model.number="form.costPerEa" type="number" step="0.01" class="C_input" />
            </div>
        </div>

        <div v-if="kind === 'fitting'" class="C_section_label">Fitting Variables</div>
        <div v-if="kind === 'fitting'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Cost R/ea</label>
                <input v-model.number="form.costPerEa" type="number" step="0.01" class="C_input" />
            </div>
        </div>

        <div v-if="kind === 'pipe' || kind === 'flange' || kind === 'fitting'" class="C_field">
            <label class="C_label">Weld Size override (mm) — blank = auto (next size up from WT)</label>
            <input v-model.number="form.weldSize" type="number" step="0.5" min="0" class="C_input" />
        </div>

        <!-- ── Paint & Lining (R/m²) with in-house / sub-contract ── -->
        <div v-if="kind === 'pipe' || kind === 'flange' || kind === 'fitting'" class="C_section_label">Paint &amp; Lining (R/m²)</div>
        <div v-if="kind === 'pipe' || kind === 'flange' || kind === 'fitting'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Execution</label>
                <select v-model="form.painting.mode" class="C_input">
                    <option value="inhouse">In-house</option>
                    <option value="subcontract">Sub-contract</option>
                </select>
            </div>
            <div class="C_field">
                <label class="C_label">External paint R/m²</label>
                <input v-model.number="form.painting.extPaint" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Internal paint R/m²</label>
                <input v-model.number="form.painting.intPaint" type="number" step="0.01" class="C_input" />
            </div>
        </div>
        <div v-if="kind === 'pipe' || kind === 'flange' || kind === 'fitting'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Internal line R/m²</label>
                <input v-model.number="form.painting.line" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Coating 1 R/m²</label>
                <input v-model.number="form.painting.coating1" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Coating 2 R/m²</label>
                <input v-model.number="form.painting.coating2" type="number" step="0.01" class="C_input" />
            </div>
        </div>
        <div v-if="kind === 'pipe' || kind === 'flange' || kind === 'fitting'" class="C_field_row">
            <div class="C_field">
                <label class="C_label">Coating 3 R/m²</label>
                <input v-model.number="form.painting.coating3" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Coating 4 R/m²</label>
                <input v-model.number="form.painting.coating4" type="number" step="0.01" class="C_input" />
            </div>
            <div class="C_field">
                <label class="C_label">Transport R/ton</label>
                <input v-model.number="form.painting.transportPerTon" type="number" step="0.01" class="C_input" />
            </div>
        </div>
    </template>

    <!-- ── Process section: parts/fasteners + process-only items (never assemblies) ── -->
    <template v-if="showProcess">
        <div class="C_section_label">Process Hours</div>
        <div class="C_hours_grid">
            <div v-for="t in trades" :key="t" class="C_field">
                <label class="C_label">{{ tradeLabel(t) }}</label>
                <input v-model="form.hours[t]" type="number" step="0.5" min="0" class="C_input" />
            </div>
        </div>
    </template>

    <div class="C_actions">
        <forge-button label="Save Item" @click="submit" />
        <span class="C_cancel" @click="cancel">Cancel</span>
    </div>
</div>
