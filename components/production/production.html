<div class="C_main">
    <div class="C_header_row">
        <div>
            <h1 class="C_title">Production Tracking</h1>
            <p class="C_subtitle">Actual vs estimated hours with auto-computed variance.</p>
        </div>
        <forge-button label="+ Log Record" @click="openNew" />
    </div>

    <div v-if="error" class="C_error">{{ error }}</div>

    <!-- Summary cards -->
    <div class="C_summary_cards">
        <div class="C_card">
            <span class="C_card_label">Estimated Hours</span>
            <span class="C_card_value num">{{ totalEst }}</span>
        </div>
        <div class="C_card">
            <span class="C_card_label">Actual Hours</span>
            <span class="C_card_value num">{{ totalAct }}</span>
        </div>
        <div class="C_card" :class="varianceClass">
            <span class="C_card_label">Variance</span>
            <span class="C_card_value num">{{ variance >= 0 ? '+' : '' }}{{ variance }}h</span>
        </div>
        <div class="C_card">
            <span class="C_card_label">Records</span>
            <span class="C_card_value num">{{ records.length }}</span>
        </div>
    </div>

    <div class="C_toolbar">
        <forge-search class="C_search" place_holder="Search records..." @onSearch="onSearch" />
    </div>

    <div v-if="loading" class="C_loading">
        <forge-loader variant="dots" label="Loading production records..." />
    </div>

    <div class="C_list">
        <forge-list
            v-if="!loading"
            :fields="fields"
            :value="rows"
            :search="search"
            @onFetch="onFetch"
        />
        <div v-if="!loading && !rows.length" class="C_empty">
            <p>No production records yet.</p>
            <forge-button label="Log your first record" @click="openNew" />
        </div>
    </div>
</div>
