<div class="C_main">
    <div class="C_header_row">
        <div>
            <h1 class="C_title">Orders</h1>
            <p class="C_subtitle">Quote-to-delivery order pipeline.</p>
        </div>
        <forge-button label="+ New Order" @click="openNew" />
    </div>

    <div v-if="error" class="C_error">{{ error }}</div>

    <div class="C_toolbar">
        <forge-search class="C_search" place_holder="Search orders..." @onSearch="onSearch" />
        <div class="C_filters">
            <span
                v-for="s in statuses"
                :key="s"
                class="C_filter_chip"
                :class="{ 'C_active': statusFilter === s }"
                @click="setStatus(s)"
            >{{ s }}</span>
        </div>
    </div>

    <div v-if="loading" class="C_loading">
        <forge-loader variant="dots" label="Loading orders..." />
    </div>

    <div class="C_list">
        <forge-list
            v-if="!loading"
            :fields="fields"
            :value="rows"
            :search="search"
            @onFetch="onFetch"
            @onSelect="onSelect"
            @onSvg="onSvg"
        />
        <div v-if="!loading && !rows.length" class="C_empty">
            <p>No orders yet.</p>
            <forge-button label="Create your first order" @click="openNew" />
        </div>
    </div>
</div>
