<div class="C_main">
    <div class="C_header_row">
        <div>
            <h1 class="C_title">Settings</h1>
            <p class="C_subtitle">Your preferences and company-wide defaults.</p>
        </div>
    </div>

    <div v-if="error" class="C_error">{{ error }}</div>
    <div v-if="msg" class="C_msg">{{ msg }}</div>

    <div v-if="loading" class="C_loading">
        <forge-loader variant="dots" label="Loading settings..." />
    </div>

    <template v-else>
        <!-- Personal preferences -->
        <div class="C_section">
            <div class="C_section_header">
                <h2>My Preferences</h2>
            </div>
            <div class="C_form">
                <forge-form
                    :fields="prefsFields"
                    v-model="prefs"
                    button_label="Save Preferences"
                    @submit="savePrefs"
                />
            </div>
        </div>

        <!-- Company settings -->
        <div class="C_section">
            <div class="C_section_header">
                <h2>Company</h2>
            </div>
            <div class="C_form">
                <forge-form
                    :fields="companyFields"
                    v-model="company"
                    button_label="Save Company"
                    @submit="saveCompany"
                />
            </div>
        </div>

        <!-- Process rates -->
        <div class="C_section">
            <div class="C_section_header">
                <h2>Process Rates <span class="C_hint">(per hour — company defaults)</span></h2>
            </div>
            <div class="C_rates_grid">
                <div v-for="t in rateFields" :key="t" class="C_rate_row">
                    <label class="C_rate_label">{{ t }}</label>
                    <input
                        v-model.number="rates[t]"
                        type="number"
                        min="0"
                        class="C_rate_input"
                        :placeholder="'e.g. 90'"
                    />
                </div>
            </div>
            <div class="C_save_row">
                <forge-button label="Save Rates" @click="saveCompany" :disabled="saving" />
            </div>
        </div>
    </template>
</div>
